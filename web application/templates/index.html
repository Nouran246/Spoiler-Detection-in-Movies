<!DOCTYPE html>
<html>

<head>
    <title>Book Review Spoiler Detector</title>
</head>

<body>

    <h1>Review Spoiler Detector</h1>

    <form method="POST">

        <textarea
            name="review"
            rows="10"
            cols="60"
            placeholder="Enter a review..."
        ></textarea>

        <br><br>

        <button type="submit">
            Detect Spoiler
        </button>

    </form>

    {% if prediction %}

        <h2>{{ prediction }}</h2>

        <h3>
            Confidence: {{ confidence }}%
        </h3>

    {% endif %}

</body>

</html>
